  <script>
    // YouTube IFrame API Setup
    let ytPlayer;
    let isPlaying = false;

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('youtube-audio-container', {
        height: '0',
        width: '0',
        videoId: 'cAk9Jq0Qxn4',
        playerVars: {
          'autoplay': 0,
          'loop': 1,
          'playlist': 'cAk9Jq0Qxn4',
          'controls': 0
        },
        events: {
          'onReady': (event) => {
            event.target.setVolume(50);
          }
        }
      });
    }

    // Load YouTube API script asynchronously
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('music-toggle-btn');
      const volumeSlider = document.getElementById('music-volume-slider');

      toggleBtn?.addEventListener('click', () => {
        if (!ytPlayer || typeof ytPlayer.playVideo !== 'function') return;
        if (isPlaying) {
          ytPlayer.pauseVideo();
          toggleBtn.querySelector('.music-status-text').textContent = '播放音樂';
          toggleBtn.style.opacity = '0.7';
          isPlaying = false;
        } else {
          ytPlayer.playVideo();
          toggleBtn.querySelector('.music-status-text').textContent = '暫停音樂';
          toggleBtn.style.opacity = '1';
          isPlaying = true;
        }
      });

      volumeSlider?.addEventListener('input', (e) => {
        const vol = e.target.value;
        if (ytPlayer && typeof ytPlayer.setVolume === 'function') {
          ytPlayer.setVolume(vol);
        }
      });
    });
  </script>
